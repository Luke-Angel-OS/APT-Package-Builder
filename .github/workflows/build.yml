name: Bulk Mirror LAOS Categories to Arch-Specific Folders

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  mirror-packages:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Configure Multiarch and Mapping Tools
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y apt-rdepends dpkg-dev

    - name: Mirror Categories and NVIDIA Drivers
      run: |
        ARCHS=("amd64" "i386")
        
        # Comprehensive categories based on your project requirements
        DEVELOPMENT=("build-essential" "git" "python3" "qtbase5-dev" "nodejs" "code")
        GAMING=("minecraft-launcher" "steam-installer" "lutris" "mangohud")
        BROWSERS=("firefox" "chromium-browser")
        PRODUCTIVITY=("libreoffice" "thunderbird" "evince")
        GRAPHICS=("gimp" "inkscape" "blender")
        DESKTOP=("ubuntu-desktop" "gnome-shell" "xfce4" "kde-plasma-desktop")
        # NVIDIA drivers for various hardware ages
        NVIDIA_DRIVERS=("nvidia-driver-550" "nvidia-driver-535" "nvidia-driver-470" "nvidia-driver-390")
        
        ALL_PACKAGES=("${DEVELOPMENT[@]}" "${GAMING[@]}" "${BROWSERS[@]}" "${PRODUCTIVITY[@]}" "${GRAPHICS[@]}" "${DESKTOP[@]}" "${NVIDIA_DRIVERS[@]}" "nala")

        # Create separate staging areas for each architecture
        mkdir -p staging_amd64 staging_i386

        for pkg in "${ALL_PACKAGES[@]}"; do
          echo "Processing package: $pkg"
          # Get recursive dependencies
          DEPS=$(apt-rdepends --follow=Depends,PreDepends "$pkg" 2>/dev/null | grep -v '^ ' | grep -v 'E:')
          
          for item in $DEPS; do
            for ARCH in "${ARCHS[@]}"; do
              # Download pre-compiled binaries into arch-specific staging folders
              cd "staging_$ARCH"
              apt-get download "${item}:${ARCH}" 2>/dev/null || true
              cd ../
            done
          done
        done
        
        # Organize into final debs/amd64/packages and debs/i386/packages
        for ARCH in "${ARCHS[@]}"; do
          FINAL_DIR="debs/$ARCH/packages"
          mkdir -p "$FINAL_DIR"
          
          # Move binaries to their specific packages folder
          cp staging_$ARCH/*.deb "$FINAL_DIR/" 2>/dev/null || true
          
          # Generate the required Packages index file for each architecture
          # This is critical for APT to recognize the folder as a repository
          cd "$FINAL_DIR"
          dpkg-scanpackages . /dev/null > Packages
          gzip -9c Packages > Packages.gz
          cd ../../../
        done

        rm -rf staging_amd64 staging_i386

    - name: Commit Packages and Indices to Repository
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        git add debs/
        if git diff --staged --quiet; then
          echo "No new packages found."
        else
          git commit -m "Mirroring categories into architecture-specific packages folders"
          git push origin main
        fi
